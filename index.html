<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B for Biriyani</title>
    <meta name="description" content="Find nearby biriyani spots, see distance and directions, and enjoy quick biriyani facts and recipes.">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="header">
        <img src="app-logo.png" alt="B for Biryani" class="logo">
    </div>

    <p class="status-message" id="status-message" aria-live="polite"></p>

    <div id="map"></div>
    <p class="provider-note">Search results are powered by Google Places when the backend and keys are configured.</p>

    <div class="container" id="restaurant-list">
        <!-- Restaurant cards will be dynamically inserted here -->
    </div>

    <div class="footer">
        <button class="footer-btn" id="did-you-know-btn">Fun Facts</button>
        <button class="footer-btn" id="recipe-of-the-day-btn">Biryani Recipe of the Day</button>
    </div>

    <div id="popup" class="popup hidden">
        <div class="popup-content">
            <p id="popup-text"></p>
            <p class="disclosure">Disclaimer: These facts and recipes are lightweight fun content for the app and may need manual verification.</p>
            <button class="popup-close" id="popup-close-btn">Close</button>
            <button class="popup-share" id="popup-share-btn">Share</button>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="location.js"></script>
    <script src="script.js"></script>
    <script src="footerscript.js"></script>

</body>
</html>
